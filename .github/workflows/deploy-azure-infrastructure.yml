name: Validate and Deploy Azure Infrastructure

on:
  push:
    branches: [main, dev]
    paths:
      - .github/workflows/deploy-azure-infrastructure.yml
      - infra/**
      - azure.yaml
  pull_request:
    branches: [main, dev]
    paths:
      - .github/workflows/deploy-azure-infrastructure.yml
      - infra/**
      - azure.yaml
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment and Azure naming scope (leave as auto-detect to infer from the branch)
        required: false
        default: auto-detect
        type: choice
        options: [auto-detect, dev, prod]
      operation:
        description: Preview changes or provision the Static Web App
        required: true
        default: what-if
        type: choice
        options: [what-if, deploy]
      site-sku:
        description: Static Web Apps plan
        required: true
        default: Free
        type: choice
        options: [Free, Standard]

permissions:
  contents: read

# Branch dev uses the dev environment, branch main uses the prod environment.
concurrency:
  group: azure-infrastructure-${{ github.event_name == 'workflow_dispatch' && ((inputs.environment != '' && inputs.environment != 'auto-detect' && inputs.environment) || (github.ref_name == 'main' && 'prod' || 'dev')) || 'validation' }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - name: Compile Bicep
        run: |
          az bicep build --file infra/main.bicep
          az bicep build --file infra/azure/site/main.bicep
          az bicep build-params --file infra/azure/site/main.dev.bicepparam
          az bicep build-params --file infra/azure/site/main.prod.bicepparam

  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ (inputs.environment != '' && inputs.environment != 'auto-detect' && inputs.environment) || (github.ref_name == 'main' && 'prod' || 'dev') }}
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      AZURE_ENVIRONMENT: ${{ vars.AZURE_ENVIRONMENT || (github.ref_name == 'main' && 'prod' || 'dev') }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_STATIC_WEB_APP_NAME: ${{ vars.AZURE_STATIC_WEB_APP_NAME }}
      AZURE_PUBLIC_SITE_URL: ${{ vars.AZURE_PUBLIC_SITE_URL }}
      AZURE_SITE_SKU: ${{ inputs.site-sku }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Verify branch matches environment
        env:
          SOURCE_REF: ${{ github.ref_name }}
        run: |
          case "$SOURCE_REF" in
            main) detected=prod ;;
            dev) detected=dev ;;
            *)
              echo "::error title=Unsupported branch::Deploy from 'dev' or 'main', not '$SOURCE_REF'."
              exit 1
              ;;
          esac

          case "${AZURE_ENVIRONMENT:-}" in
            dev|prod) normalized_environment="$AZURE_ENVIRONMENT" ;;
            development|production) normalized_environment="${AZURE_ENVIRONMENT/development/dev}" ; normalized_environment="${normalized_environment/production/prod}" ;;
            *)
              echo "::error title=Invalid environment::AZURE_ENVIRONMENT must be 'dev'/'prod' or 'development'/'production'."
              exit 1
              ;;
          esac

          if [[ "$normalized_environment" != "$detected" ]]; then
            echo "::error title=Branch and environment mismatch::Branch '$SOURCE_REF' maps to $detected, not $normalized_environment."
            exit 1
          fi

          if [ -f config/deploy.config.json ]; then
            jq -e --arg env "$normalized_environment" '.environments[$env]' config/deploy.config.json >/dev/null
          fi

          echo "Targeting the $normalized_environment environment from '$SOURCE_REF'." >> "$GITHUB_STEP_SUMMARY"
          echo "AZURE_ENVIRONMENT=$normalized_environment" >> "$GITHUB_ENV"

      - name: Validate Environment configuration
        run: bash infra/azure/validate-environment.sh
      - name: Sign in to Azure
        uses: azure/login@8216e11d8cd9b42fe925c852af8e76311ff067ac # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Verify resource group
        run: |
          test "$(az group exists --name "$AZURE_RESOURCE_GROUP")" = true
      - name: Preview or deploy Static Web App
        run: |
          command_name="${{ inputs.operation }}"
          if [[ "$command_name" == deploy ]]; then command_name=create; fi
          az deployment group "$command_name" \
            --name "m365profiles-site-${GITHUB_RUN_NUMBER}" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --parameters location="$AZURE_LOCATION" siteName="$AZURE_STATIC_WEB_APP_NAME" environmentName="${AZURE_ENVIRONMENT:-dev}" siteSkuName="$AZURE_SITE_SKU"
