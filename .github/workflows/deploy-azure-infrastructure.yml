name: Validate and Deploy Azure Infrastructure

on:
  push:
    branches: [main, dev]
    paths:
      - .github/workflows/deploy-azure-infrastructure.yml
      - infra/**
      - azure.yaml
  pull_request:
    branches: [main, dev]
    paths:
      - .github/workflows/deploy-azure-infrastructure.yml
      - infra/**
      - azure.yaml
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment and Azure naming scope (leave as auto-detect to infer from the branch)
        required: false
        default: auto-detect
        type: choice
        options: [auto-detect, dev, prod]
      operation:
        description: Preview changes or provision the Static Web App
        required: true
        default: what-if
        type: choice
        options: [what-if, deploy]
      site-sku:
        description: Static Web Apps plan
        required: true
        default: Free
        type: choice
        options: [Free, Standard]

permissions:
  contents: read

# Branch dev uses the dev environment, branch main uses the prod environment.
concurrency:
  group: azure-infrastructure-${{ github.event_name == 'workflow_dispatch' && ((inputs.environment != '' && inputs.environment != 'auto-detect' && inputs.environment) || (github.ref_name == 'main' && 'prod' || 'dev')) || 'validation' }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - name: Compile Bicep
        run: |
          az bicep build --file infra/main.bicep
          az bicep build --file infra/azure/site/main.bicep
          az bicep build-params --file infra/azure/site/main.bicepparam

  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ (inputs.environment != '' && inputs.environment != 'auto-detect' && inputs.environment) || (github.ref_name == 'main' && 'prod' || 'dev') }}
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      AZURE_ENVIRONMENT: ${{ vars.AZURE_ENVIRONMENT || (github.ref_name == 'main' && 'production' || 'development') }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_STATIC_WEB_APP_NAME: ${{ vars.AZURE_STATIC_WEB_APP_NAME }}
      AZURE_PUBLIC_SITE_URL: ${{ vars.AZURE_PUBLIC_SITE_URL }}
      AZURE_SITE_SKU: ${{ inputs.site-sku }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Verify branch matches environment
        env:
          SOURCE_REF: ${{ github.ref_name }}
        run: |
          case "$SOURCE_REF" in
            main) detected=production ;;
            dev) detected=development ;;
            *)
              echo "::error title=Unsupported branch::Deploy from 'dev' (development) or 'main' (production), not '$SOURCE_REF'."
              exit 1
              ;;
          esac

          if [[ "$AZURE_ENVIRONMENT" != "$detected" ]]; then
            echo "::error title=Branch and environment mismatch::Branch '$SOURCE_REF' maps to $detected, not $AZURE_ENVIRONMENT."
            exit 1
          fi

          echo "Targeting the $AZURE_ENVIRONMENT environment from '$SOURCE_REF'." >> "$GITHUB_STEP_SUMMARY"

      - name: Validate Environment configuration
        run: bash infra/azure/validate-environment.sh
      - name: Sign in to Azure
        uses: azure/login@8216e11d8cd9b42fe925c852af8e76311ff067ac # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Verify resource group
        run: |
          test "$(az group exists --name "$AZURE_RESOURCE_GROUP")" = true
      - name: Preview or deploy Static Web App
        run: |
          command_name="${{ inputs.operation }}"
          if [[ "$command_name" == deploy ]]; then command_name=create; fi
          az deployment group "$command_name" \
            --name "m365profiles-site-${GITHUB_RUN_NUMBER}" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --parameters location="$AZURE_LOCATION" siteName="$AZURE_STATIC_WEB_APP_NAME" environmentName="$AZURE_ENVIRONMENT" siteSkuName="$AZURE_SITE_SKU"
