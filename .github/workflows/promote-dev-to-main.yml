name: Promote Dev to Main

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: promote-dev-to-main
  cancel-in-progress: false

jobs:
  create_promotion_pull_request:
    runs-on: ubuntu-latest
    steps:
      - name: Require the dev branch
        run: |
          test "${GITHUB_REF_NAME}" = "dev" || {
            echo "Run this workflow from the dev branch."
            exit 1
          }

      - name: Create or find promotion pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pull_request_url="$(gh pr list --base main --head dev --state open --json url --jq '.[0].url')"
          if [[ -n "$pull_request_url" ]]; then
            echo "Promotion pull request already open: $pull_request_url"
            exit 0
          fi

          gh pr create \
            --base main \
            --head dev \
            --title "Promote dev to main" \
            --body "Promotes the validated development branch to production."
