name: Deploy

on:
  push:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment to deploy (leave as auto-detect to infer from the branch)
        required: false
        default: auto-detect
        type: choice
        options: [auto-detect, dev, prod]

permissions:
  contents: read

# Branch dev uses the dev environment, branch main uses the prod environment.
concurrency:
  group: deploy-${{ (inputs.environment != '' && inputs.environment != 'auto-detect' && inputs.environment) || (github.ref_name == 'main' && 'prod' || 'dev') }}
  cancel-in-progress: false

jobs:
  deploy:
    uses: ninjapaw/pawprint/.github/workflows/kit-deploy-static-site.yml@de65a5017f51b2ca9213ec07b5fbfc889262fee2
    permissions:
      contents: write
    with:
      environment: ${{ inputs.environment || 'auto-detect' }}
      pre-build-commands: npm run validate-tree
    secrets:
      AZURE_STATIC_WEB_APPS_API_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
