name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment to deploy (leave as auto-detect to infer from the branch)
        required: false
        default: auto-detect
        type: choice
        options: [auto-detect, dev, prod]

permissions:
  contents: read

# Main pushes publish prod; a manual main run can select dev explicitly.
concurrency:
  group: deploy-${{ (inputs.environment != '' && inputs.environment != 'auto-detect' && inputs.environment) || 'prod' }}
  cancel-in-progress: false

jobs:
  deploy:
    uses: ninjapaw/pawprint/.github/workflows/kit-deploy-static-site.yml@805cae1d739b7bbab1f9733d249372a4b29f66e4
    permissions:
      contents: write
    with:
      environment: ${{ inputs.environment || 'auto-detect' }}
      pre-build-commands: npm run validate-tree
    secrets:
      AZURE_STATIC_WEB_APPS_API_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
