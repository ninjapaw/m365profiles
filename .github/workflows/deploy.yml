name: Deploy

on:
  push:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment to deploy (leave as auto-detect to infer from the branch)
        required: false
        default: auto-detect
        type: choice
        options: [auto-detect, development, production]

permissions:
  contents: read

concurrency:
  group: deploy-${{ (inputs.environment && inputs.environment != 'auto-detect' && inputs.environment) || (github.ref_name == 'dev' && 'development' || 'production') }}
  cancel-in-progress: false

jobs:
  resolve_environment:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.detect.outputs.environment }}
      site_url: ${{ steps.detect.outputs.site_url }}
    steps:
      - name: Detect environment from branch or input
        id: detect
        run: |
          branch="${{ github.ref_name }}"
          input_environment="${{ inputs.environment }}"

          if [ -n "$input_environment" ] && [ "$input_environment" != "auto-detect" ]; then
            environment="$input_environment"
          elif [ "$branch" = "main" ]; then
            environment="production"
          elif [ "$branch" = "dev" ]; then
            environment="development"
          else
            echo "::error::Cannot auto-detect environment for branch '$branch'. Re-run with an explicit environment input."
            exit 1
          fi

          if [ "$environment" = "production" ]; then
            site_url="https://m365profiles.com"
          else
            site_url="https://dev.m365profiles.com"
          fi

          echo "Detected branch: $branch"
          echo "Resolved environment: $environment"
          echo "environment=$environment" >> "$GITHUB_OUTPUT"
          echo "site_url=$site_url" >> "$GITHUB_OUTPUT"

  build_and_deploy:
    needs: resolve_environment
    runs-on: ubuntu-latest
    environment: deployment-${{ needs.resolve_environment.outputs.environment }}
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - run: npm run validate-tree

      - name: Set build version
        id: version
        run: |
          app_version="v$(date -u +'%Y.%m.%d')-${GITHUB_RUN_NUMBER}"
          echo "PUBLIC_APP_VERSION=$app_version" >> "$GITHUB_ENV"
          echo "app_version=$app_version" >> "$GITHUB_OUTPUT"
          echo "PUBLIC_BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Build
        env:
          PUBLIC_SITE_URL: ${{ vars.AZURE_PUBLIC_SITE_URL || vars.PUBLIC_SITE_URL || needs.resolve_environment.outputs.site_url }}
          PUBLIC_SITE_BASE: "/"
        run: npm run build

      - name: Verify Static Web Apps deployment token
        env:
          AZURE_STATIC_WEB_APPS_API_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: ': "${AZURE_STATIC_WEB_APPS_API_TOKEN:?Set this secret after provisioning the Static Web App}"'

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "dist"
          output_location: ""
          skip_app_build: true

  release:
    if: ${{ needs.resolve_environment.outputs.environment == 'production' && (github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip release]')) }}
    needs: [resolve_environment, build_and_deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create release
        run: |
          gh release create "${APP_VERSION}" \
            --title "${APP_VERSION}" \
            --generate-notes || true
        env:
          APP_VERSION: ${{ needs.build_and_deploy.outputs.app_version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
