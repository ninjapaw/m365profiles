name: Deploy

on:
  push:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment to deploy
        required: true
        default: production
        type: choice
        options: [development, production]

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.environment || (github.ref_name == 'dev' && 'development' || 'production') }}
  cancel-in-progress: false

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    environment: deployment-${{ inputs.environment || (github.ref_name == 'dev' && 'development' || 'production') }}
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - run: npm run validate-tree

      - name: Set build version
        id: version
        run: |
          app_version="v$(date -u +'%Y.%m.%d')-${GITHUB_RUN_NUMBER}"
          echo "PUBLIC_APP_VERSION=$app_version" >> "$GITHUB_ENV"
          echo "app_version=$app_version" >> "$GITHUB_OUTPUT"
          echo "PUBLIC_BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Build
        env:
          PUBLIC_SITE_URL: ${{ vars.AZURE_PUBLIC_SITE_URL || vars.PUBLIC_SITE_URL || (github.ref_name == 'dev' && 'https://dev.m365profiles.com' || 'https://m365profiles.com') }}
          PUBLIC_SITE_BASE: "/"
        run: npm run build

      - name: Verify Static Web Apps deployment token
        env:
          AZURE_STATIC_WEB_APPS_API_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: ': "${AZURE_STATIC_WEB_APPS_API_TOKEN:?Set this secret after provisioning the Static Web App}"'

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "dist"
          output_location: ""
          skip_app_build: true

  release:
    if: ${{ (github.ref_name == 'main' || github.event_name == 'workflow_dispatch') && (github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip release]')) }}
    needs: build_and_deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create release
        run: |
          gh release create "${APP_VERSION}" \
            --title "${APP_VERSION}" \
            --generate-notes || true
        env:
          APP_VERSION: ${{ needs.build_and_deploy.outputs.app_version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
